name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: 'Publish Target'
        required: true
        default: 'pypi'
        type: choice
        options:
          - pypi
          - testpypi

permissions:
  contents: read
  id-token: write

jobs:
  pypi-publish:
    name: Build & Publish to PyPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-mock aioresponses build twine
          pip install -e .

      - name: 🏷️ Verify release tag matches package version
        if: ${{ github.event_name == 'release' }}
        run: |
          PKG_VERSION="$(python -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          TAG="${GITHUB_REF_NAME}"
          echo "package version: $PKG_VERSION | release tag: $TAG"
          if [ "v$PKG_VERSION" != "$TAG" ]; then
            echo "::error::release tag $TAG does not match pyproject version v$PKG_VERSION"
            exit 1
          fi

      - name: 🔒 Pre-Submit Leak Check
        run: |
          python scripts/presubmit.py

      - name: 🧪 Run Unit Test Suite
        run: |
          pytest tests/ -v

      - name: 📦 Build Source Distribution & Binary Wheel
        run: |
          python -m build

      - name: 🔍 Validate Package Metadata (twine check)
        run: |
          python -m twine check dist/*

      - name: 🚀 Publish to TestPyPI
        if: ${{ github.event.inputs.target == 'testpypi' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

      - name: 🚀 Publish to PyPI
        if: ${{ github.event_name == 'release' || github.event.inputs.target == 'pypi' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: false
