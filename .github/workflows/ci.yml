name: SlopWatch CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly recall check against the live DataDog malware corpus — separate
    # from the PR-blocking job below so a flaky/rate-limited network fetch
    # never blocks an unrelated pull request.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

jobs:
  gatekeeper-and-test:
    name: Audit, Test & Package (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-mock aioresponses build twine
          pip install -e .

      - name: 🔒 Run Leak & Sanitization Gatekeeper
        run: |
          python scripts/presubmit.py

      - name: 🧪 Run Unit Test Suite
        run: |
          pytest tests/ -v

      - name: 📦 Build Distribution Wheel & Tarball
        run: |
          python -m build

      - name: 🔍 Validate PyPI Package Metadata (twine check)
        run: |
          python -m twine check dist/*

      - name: 🛡️ Verify Standalone CLI Execution
        run: |
          slopwatch --version
          slopwatch --help
          slopwatch info

  malware-corpus-recall-gate:
    name: Golden-Malware Recall Gate (scheduled, non-blocking for PRs)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-mock
          pip install -e .

      - name: 🎯 Run recall regression against live DataDog malware corpus
        run: |
          pytest tests/test_golden_malware_corpus.py -m corpus -v -rxs
