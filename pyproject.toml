[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flagthis-sentinel"
version = "0.1.0"
description = "Proactive Phantom Squatting Detection within the Adversary Exploitation Window (AEW)"
readme = "README.md"
authors = [{ name = "FlagThis Research Team" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Security",
]
dependencies = [
    "aiohttp>=3.9.0",
    "aiodns>=3.1.0",
    "aiosqlite>=0.19.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "rich>=13.7.0",
    "click>=8.1.0",
    "dnspython>=2.5.0",
    "yara-python>=4.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "aioresponses>=0.7.6",
]

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sentinel" = [
    "rules/*.yar",
    "signatures/*.json",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"

