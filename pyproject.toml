[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "slopwatch"
version = "0.1.0"
description = "Deterministic Zero-LLM AI package hallucination, slopsquatting, and supply chain threat auditor."
readme = "README.md"
authors = [
    { name = "Royans K" },
]
license = "Apache-2.0"
requires-python = ">=3.11"
keywords = [
    "security",
    "supply-chain",
    "malware-analysis",
    "ast-analysis",
    "yara",
    "typosquatting",
    "phantom-squatting",
    "ai-hallucination",
    "dependency-auditing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.9.0",
    "aiodns>=3.1.0",
    "aiosqlite>=0.19.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "rich>=13.7.0",
    "click>=8.1.0",
    "dnspython>=2.5.0",
    "yara-python>=4.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "aioresponses>=0.7.6",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/royans/slopwatch/"
Documentation = "https://github.com/royans/slopwatch/#readme"
Repository = "https://github.com/royans/slopwatch/"
Issues = "https://github.com/royans/slopwatch/issues"

[project.scripts]
slopwatch = "slopwatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["slopwatch*"]

[tool.setuptools.package-data]
"slopwatch" = [
    "py.typed",
    "rules/*.yar",
    "signatures/*.json",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
markers = [
    "corpus: network-dependent golden-malware regression test against the live DataDog/OSSF dataset; excluded from the default run, see addopts below.",
]
addopts = "-m 'not corpus'"
